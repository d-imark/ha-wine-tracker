services:
  wine-tracker:
    image: ghcr.io/xenofex7/wine-tracker:latest
    # To build locally instead, comment out 'image' and uncomment:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    ports:
      - "5050:5050"
    volumes:
      - .:/data
    environment:
      # ── Authentication ──────────────────────────────────────────────
      - AUTH_ENABLED=true
      # Format: user:password (admin) or user:password:readonly (read-only)
      - USERS=admin:changeme
      - SECRET_KEY=change-this-to-a-random-string

      # ── General ─────────────────────────────────────────────────────
      # Currency: CHF, EUR, USD, GBP, CAD, AUD
      - CURRENCY=CHF
      # Language: de, en, fr, it, es, pt, nl
      - LANGUAGE=de

      # ── AI Provider (optional — pick ONE) ───────────────────────────
      # Provider: none, anthropic, openai, openrouter, ollama, minimax, mistral
      # - AI_PROVIDER=anthropic

      # Anthropic (Claude):
      # - ANTHROPIC_API_KEY=sk-ant-...
      # - ANTHROPIC_MODEL=claude-opus-4-8

      # OpenAI (GPT):
      # - OPENAI_API_KEY=sk-...
      # - OPENAI_MODEL=gpt-5.5

      # OpenRouter (multi-provider):
      # - OPENROUTER_API_KEY=sk-or-...
      # - OPENROUTER_MODEL=anthropic/claude-opus-4.8

      # Ollama (local, no API key needed):
      # - OLLAMA_HOST=http://host.docker.internal:11434
      # - OLLAMA_MODEL=llama3.2-vision

      # MiniMax:
      # - MINIMAX_API_KEY=...
      # - MINIMAX_MODEL=MiniMax-M3

      # Mistral:
      # - MISTRAL_API_KEY=...
      # - MISTRAL_MODEL=mistral-medium-latest

    restart: unless-stopped

volumes:
  wine-data:
